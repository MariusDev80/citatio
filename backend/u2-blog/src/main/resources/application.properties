spring.application.name=u2-blog

# Port dedie du microservice (distinct de u1-communication).
server.port=${SERVER_PORT:8082}

# Base de donnees dediee au module (une DB par microservice).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:citatio_u2_db}
spring.datasource.username=${DB_USER:u2_app}
spring.datasource.password=${DB_PASSWORD:u2_dev_password}

# JPA / Hibernate
# Le schema appartient a Flyway (src/main/resources/db/migration) : Hibernate se
# contente de verifier que les entites correspondent aux tables, et refuse de
# demarrer sinon. Avec `update`, une colonne renommee dans le code creait une
# seconde colonne en production sans migrer la premiere.
spring.jpa.hibernate.ddl-auto=validate
# Pas de database-platform : Hibernate 6 detecte le dialecte a la connexion, et
# le fixer ecrivait un avertissement HHH90000025 a chaque demarrage.
# show-sql a false : il ecrivait chaque requete SQL dans les logs Docker de
# production, sans rotation jusqu'ici (audit INF-04).
spring.jpa.show-sql=false
# Session JPA fermee a la sortie du service, pas a la fin de la reponse HTTP :
# une connexion n'est plus tenue pendant la serialisation, et un chargement
# paresseux oublie echoue en test au lieu de passer en silence.
spring.jpa.open-in-view=false

# Le service ne sert aucun fichier statique. Le gestionnaire de ressources
# statiques de Spring MVC restait pourtant actif, et c'est le point d'entree de
# deux avis de securite Spring MVC (audit SEC-05). Meme valeur dans le profil de
# test, pour que ApiExceptionHandlerTest verifie le 404 dans cette configuration.
spring.web.resources.add-mappings=false
# Sans ressources statiques, une URL inconnue ne passe plus par
# NoResourceFoundException mais par le journal PageNotFound de Spring, qui ecrit
# un WARN par passage de robot. Le 404 reste rendu en Problem Details ; seule la
# ligne de log disparait.
logging.level.org.springframework.web.servlet.PageNotFound=ERROR

# Televersement de l'image d'un article. 2 Mo couvrent une photo de couverture
# exportee pour le web ; au-dela, c'est un fichier d'appareil photo a reduire
# avant envoi. Spring rend alors un 413 en Problem Details.
spring.servlet.multipart.max-file-size=2MB
# Image, plus le JSON de l'article (corps de 50 000 caracteres au plus, soit
# 300 Ko dans le pire cas d'echappement).
spring.servlet.multipart.max-request-size=3MB

# URL de base du microservice u1-communication (nom de service Docker en prod).
u1.base-url=${U1_BASE_URL:http://localhost:8081}

# ── Sondes de sante (Actuator) ───────────────────────────────────────────────
# Seul /actuator/health est expose, et uniquement sur le reseau Docker interne :
# la gateway Caddy ne route que /api/uX/*.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Aucun detail dans la reponse : le statut agrege est tout ce dont Docker a besoin,
# et le reste decrirait l'infrastructure.
management.endpoint.health.show-details=never
# La liveness ne regarde deliberement PAS la base : une base momentanement absente
# ne doit pas faire redemarrer en boucle un service par ailleurs sain.
# La readiness, elle, l'inclut : sans base, le service ne peut rien servir d'utile.
management.endpoint.health.group.readiness.include=readinessState,db

# Origines autorisees en CORS. En production le frontend est servi par la meme
# gateway que /api/uX, donc en meme origine : cette liste ne sert qu'aux appels
# hors production. Dev avec le serveur Angular :
# CORS_ALLOWED_ORIGINS=http://localhost:4200
citatio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://citatio-geo.com,https://www.citatio-geo.com}
