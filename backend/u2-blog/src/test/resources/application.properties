# Profil de test : base H2 en memoire, aucune dependance externe.
spring.datasource.url=jdbc:h2:mem:u2_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Meme mecanisme qu'en production : Flyway cree le schema, Hibernate le
# verifie. Avec create-drop, les tests passeraient sur un schema genere par
# Hibernate et une migration fausse ne se verrait qu'au deploiement.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Reprises de la configuration de production, que ce fichier masque : sans elles,
# les tests tourneraient avec des ressources statiques et open-in-view actifs,
# donc pas dans les conditions du deploiement.
spring.jpa.open-in-view=false
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Requis pour instancier le bean u1RestClient au chargement du contexte.
u1.base-url=http://localhost:8081

# Requis par CommonWebConfig : la valeur importe peu, sa presence si.
citatio.cors.allowed-origins=https://citatio-geo.com
