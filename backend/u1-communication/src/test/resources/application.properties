# Profil de test : base H2 en memoire, aucune dependance externe.
spring.datasource.url=jdbc:h2:mem:u1_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Requis pour instancier le bean u2Client au chargement du contexte.
u2.base-url=http://localhost:8082

# Requis par CommonWebConfig : la valeur importe peu, sa presence si.
citatio.cors.allowed-origins=https://citatio-geo.com

# Mail : hote bidon et adresses en .test (RFC 6761, jamais routable). Le bean
# JavaMailSender doit exister pour que le contexte charge, aucun test n'ouvre
# de connexion SMTP : ContactMailSender est mocke partout ou l'envoi est en jeu.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.properties.mail.smtp.localhost=example.test
spring.mail.properties.mail.from=formulaire@example.test
citatio.mail.from=formulaire@example.test
citatio.mail.from-name=Formulaire Citatio (test)
citatio.mail.to=contact@example.test
