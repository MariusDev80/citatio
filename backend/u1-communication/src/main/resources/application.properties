spring.application.name=u1-communication

# Port dedie du microservice (distinct de u2-blog).
server.port=${SERVER_PORT:8081}

# Base de donnees dediee au module (une DB par microservice).
# Les variables sont injectees par Docker ; valeurs par defaut pour le dev local.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:citatio_u1_db}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# URL de base du microservice u2-blog (nom de service Docker en prod).
u2.base-url=${U2_BASE_URL:http://localhost:8082}

# ── Sondes de sante (Actuator) ───────────────────────────────────────────────
# Seul /actuator/health est expose, et uniquement sur le reseau Docker interne :
# la gateway Caddy ne route que /api/uX/*.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Aucun detail dans la reponse : le statut agrege est tout ce dont Docker a besoin,
# et le reste decrirait l'infrastructure.
management.endpoint.health.show-details=never
# La liveness ne regarde deliberement PAS la base : une base momentanement absente
# ne doit pas faire redemarrer en boucle un service par ailleurs sain.
# La readiness, elle, l'inclut : sans base, le service ne peut rien servir d'utile.
management.endpoint.health.group.readiness.include=readinessState,db

# Origines autorisees en CORS. En production le frontend est servi par la meme
# gateway que /api/uX, donc en meme origine : cette liste ne sert qu'aux appels
# hors production. Dev avec le serveur Angular :
# CORS_ALLOWED_ORIGINS=http://localhost:4200
citatio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://citatio-geo.com,https://www.citatio-geo.com}

# ── Envoi des emails (formulaire de contact) ─────────────────────────────────
# Le compte expediteur n'est pas arrete : TOUT passe par variables
# d'environnement, valeurs par defaut surchargeables. Aucun identifiant ici,
# changer de compte d'envoi ne demande ni modification de code ni rebuild.
spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Port 465 : SSL implicite (et non STARTTLS, qui se ferait sur 587).
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.auth=true
# Timeouts serres : l'envoi est asynchrone, mais un thread bloque sur un SMTP
# muet reste un thread bloque. 5 s suffisent largement a un serveur qui repond.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Nom annonce au EHLO. Sans cette propriete, JavaMail annonce le nom d'hote de
# la machine : en conteneur, c'est l'identifiant Docker, soit une etiquette nue
# sans point (mesure en production : "EHLO 18b9c67103d0"). Un EHLO qui n'est pas
# un nom de domaine pleinement qualifie est un motif de filtrage courant, et il
# apparait en clair dans l'en-tete Received du message recu.
# Surchargeable : un futur envoi depuis un autre domaine devrait annoncer le sien.
spring.mail.properties.mail.smtp.localhost=${MAIL_EHLO:citatio-geo.com}

# Domaine du Message-ID. Sans mail.from, JavaMail le derive du nom d'hote local :
# dans le conteneur cela donne <...@3f8a1c9d2e4b>, un domaine qui n'existe pas.
# Un Message-ID dont le domaine ne correspond pas a l'expediteur est un motif
# note par les filtres antispam. Mesure avant / apres, meme message :
#   <...@macbook-de-marius12.home>  ->  <...@citatio-geo.com>
# Meme variable que citatio.mail.from : les deux ne doivent pas diverger.
spring.mail.properties.mail.from=${MAIL_FROM:client-request@citatio-geo.com}

# Adresses de l'envoi. Ce sont nos adresses publiques, pas des secrets, mais
# elles restent surchargeables : la boite d'envoi dediee peut encore changer.
citatio.mail.from=${MAIL_FROM:client-request@citatio-geo.com}
citatio.mail.from-name=${MAIL_FROM_NAME:Formulaire Citatio}
citatio.mail.to=${MAIL_TO:contact@citatio-geo.com}
