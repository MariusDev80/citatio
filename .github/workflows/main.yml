name: CI/CD Pipeline

# Integration continue et environnement dev. La mise en production n'est plus
# declenchee ici : elle passe par le bouton de deploy-prod.yml, qui ne promeut
# qu'un commit deja deploye et verifie en dev par ce workflow.
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# Un nouveau commit sur une PR annule le pipeline du commit precedent : la dev
# doit montrer le dernier etat de la PR, pas finir de deployer un etat perime.
# Les pushs sur develop ont chacun leur groupe (run_id) et ne s'annulent jamais.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Tests unitaires (Vitest)
  # Tourne sur TOUT push/PR, jamais dans Docker
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --configuration=ci

  # ─────────────────────────────────────────────
  # Job 2 : Tests de non-régression (Playwright)
  # Tourne sur TOUT push/PR, jamais dans Docker
  # ─────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app (prerender)
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3 : Tests backend (JUnit 5, H2 en mémoire)
  # Tourne sur TOUT push/PR, en parallèle du front.
  # Les images Docker se construisent avec -DskipTests :
  # sans ce job, aucun test backend ne tournait nulle part
  # et l'indépendance u1/u2 n'était garantie par rien.
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend Tests (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ./mvnw et non mvn : la version de Maven est celle du dépôt, pas celle
      # que le runner GitHub embarque et fait évoluer sans nous prévenir.
      - name: Run backend tests
        run: ./mvnw -B test

  # ─────────────────────────────────────────────
  # Job 4 : Build & Push Docker (push develop, et PR du dépôt)
  # Ne se déclenche que si les tests passent.
  # Les PR venues d'un fork ne reçoivent aucun secret : elles gardent les tests,
  # sans build ni déploiement.
  # Les PR de Dependabot non plus : GitHub leur donne un GITHUB_TOKEN en lecture
  # seule, quelles que soient les `permissions` du job, donc elles ne peuvent pas
  # publier d'image. Elles sont construites et déployées par dev-dependabot.yml,
  # qui se déclenche à la fin de ce pipeline avec un jeton normal.
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker images
    needs: [ test, e2e, backend-test ]
    if: >-
      github.event_name == 'push'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/build-images
        with:
          # Sur une PR, github.sha est le commit de fusion de la PR dans develop :
          # la dev montre ce que develop deviendrait après le merge.
          tag: ${{ github.sha }}

  # ─────────────────────────────────────────────
  # Job 5 : Déploiement de l'environnement dev
  # À chaque commit de PR et à chaque push sur develop, après le build.
  # Un seul environnement dev : le dernier déploiement l'emporte.
  # ─────────────────────────────────────────────
  deploy-dev:
    name: Deploy to dev
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # En série : deux déploiements simultanés se disputeraient les mêmes
    # conteneurs. Un déploiement en cours n'est jamais annulé par ce groupe
    # (seul le pipeline d'une PR dépassée l'est, voir `concurrency` en tête).
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/vps-ssh
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.VPS_IP }}
          user: ${{ secrets.VPS_USER }}

      - uses: ./.github/actions/deploy-dev
        with:
          image-tag: ${{ github.sha }}
          ghcr-pat: ${{ secrets.GHCR_PAT }}
          mail-host: ${{ secrets.MAIL_HOST }}
          mail-port: ${{ secrets.MAIL_PORT }}
          mail-ssl: ${{ secrets.MAIL_SSL }}
          mail-username: ${{ secrets.MAIL_USERNAME }}
          mail-password: ${{ secrets.MAIL_PASSWORD }}
          mail-from: ${{ secrets.MAIL_FROM }}
          mail-to: ${{ secrets.MAIL_TO }}
