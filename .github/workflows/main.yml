name: CI/CD Pipeline

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Tests unitaires (Vitest)
  # Tourne sur TOUT push/PR, jamais dans Docker
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --configuration=ci

  # ─────────────────────────────────────────────
  # Job 2 : Tests de non-régression (Playwright)
  # Tourne sur TOUT push/PR, jamais dans Docker
  # ─────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app (prerender)
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3 : Tests backend (JUnit 5, H2 en mémoire)
  # Tourne sur TOUT push/PR, en parallèle du front.
  # Les images Docker se construisent avec -DskipTests :
  # sans ce job, aucun test backend ne tournait nulle part
  # et l'indépendance u1/u2 n'était garantie par rien.
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend Tests (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ./mvnw et non mvn : la version de Maven est celle du dépôt, pas celle
      # que le runner GitHub embarque et fait évoluer sans nous prévenir.
      - name: Run backend tests
        run: ./mvnw -B test

  # ─────────────────────────────────────────────
  # Job 4 : Build & Push Docker (develop only)
  # Ne se déclenche que si les tests passent
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker images
    needs: [ test, e2e, backend-test ]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Lowercase repo name
        run: echo "REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Front
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/frontend:latest

      - name: Build & Push u1-communication
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/u1-communication/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/u1-communication:latest

      - name: Build & Push u2-blog
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/u2-blog/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/u2-blog:latest

  # ─────────────────────────────────────────────
  # Job 5 : Déploiement VPS (develop only)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Synchronise la conf d'infra vers le VPS AVANT de (re)démarrer la stack.
      # Sans ça, modifier docker-compose.yml / Caddyfile / init.sql dans le repo
      # n'a AUCUN effet sur le VPS (le déploiement ne faisait que tirer les images).
      - name: Sync infra config to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,Caddyfile,backend/docker/postgres/init.sql"
          target: "/opt/citatio"
          overwrite: true

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # `set -e` tient le rôle de l'option `script_stop`, que l'action a
          # supprimée en v1.2.5 (son README renvoie explicitement vers `set -e`).
          # Sans lui, une commande qui échoue laisse le job au vert et on
          # retrouve les déploiements "réussis" qui ne déploient rien.
          script: |
            set -e
            cd /opt/citatio
            # Authentification au registre privé GHCR depuis le pipeline,
            # pour ne plus dépendre d'un login manuel sur le VPS qui expire silencieusement.
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u MariusDev80 --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            docker ps
