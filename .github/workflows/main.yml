name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # --- ÉTAPE AJOUTÉE : Conversion du nom en minuscules ---
      - name: Lowercase repo name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Front
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # On utilise la nouvelle variable env.REPO_LC
          tags: ghcr.io/${{ env.REPO_LC }}/frontend:latest

      - name: Build & Push Back
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # On utilise la nouvelle variable env.REPO_LC
          tags: ghcr.io/${{ env.REPO_LC }}/backend:latest
      
      # On envoie les fichiers de config sur le VPS
      - name: Copy config files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile" # On envoie ces deux fichiers
          target: "/opt/citatio"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/citatio
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker ps
