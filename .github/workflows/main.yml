name: CI/CD Pipeline

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Tests unitaires (Vitest)
  # Tourne sur TOUT push/PR, jamais dans Docker
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --configuration=ci

  # ─────────────────────────────────────────────
  # Job 2 : Tests de non-régression (Playwright)
  # Tourne sur TOUT push/PR, jamais dans Docker
  # ─────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app (prerender)
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3 : Tests backend (JUnit 5, H2 en mémoire)
  # Tourne sur TOUT push/PR, en parallèle du front.
  # Les images Docker se construisent avec -DskipTests :
  # sans ce job, aucun test backend ne tournait nulle part
  # et l'indépendance u1/u2 n'était garantie par rien.
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend Tests (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # ./mvnw et non mvn : la version de Maven est celle du dépôt, pas celle
      # que le runner GitHub embarque et fait évoluer sans nous prévenir.
      - name: Run backend tests
        run: ./mvnw -B test

  # ─────────────────────────────────────────────
  # Job 4 : Build & Push Docker (develop only)
  # Ne se déclenche que si les tests passent
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker images
    needs: [ test, e2e, backend-test ]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Lowercase repo name
        run: echo "REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `provenance: false` sur les trois images : sans cela, buildx peut publier
      # un index et un manifeste d'attestation à côté de l'image, soit plusieurs
      # versions GHCR par build. Le nettoyage (job 6) compte des versions : il
      # garderait moins de 3 builds, et pourrait supprimer une partie d'une image
      # encore utilisée.
      - name: Build & Push Front
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: ghcr.io/${{ env.REPO_LC }}/frontend:latest

      - name: Build & Push u1-communication
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/u1-communication/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ env.REPO_LC }}/u1-communication:latest

      - name: Build & Push u2-blog
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/u2-blog/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ env.REPO_LC }}/u2-blog:latest

  # ─────────────────────────────────────────────
  # Job 5 : Déploiement VPS (develop only)
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # OpenSSH du runner, et non appleboy/scp-action et appleboy/ssh-action.
      # Ces deux actions recevaient la clé SSH, le PAT GHCR et les secrets SMTP,
      # étaient épinglées par un tag déplaçable, et ne vérifiaient pas la clé
      # d'hôte du VPS. Les épingler par SHA ne suffisait pas : elles téléchargent
      # au lancement un binaire depuis leurs releases, dont la somme de contrôle
      # vient de la même release. Un compte tiers compromis tenait donc la
      # production (audit SEC-02, voir la compromission de tj-actions en 2025).
      #
      # Les secrets passent par l'environnement du step, jamais par le texte du
      # script : `${{ }}` dans un `run:` serait recopié tel quel dans le fichier
      # exécuté par le runner.
      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_SSL: ${{ secrets.MAIL_SSL }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          ( umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy )

          # Clé d'hôte du VPS, lue sur le serveur lui-même le 14 septembre 2026
          # (ED25519 SHA256:e5cPDbnEq7CTk7KTc7XXSKCMfVXtEO2cYsCKkiwqYiI). Une clé
          # publique n'est pas un secret : elle reste lisible ici, dans le diff.
          # Si le VPS est réinstallé, le déploiement échoue au lieu de parler à un
          # serveur inconnu ; relire alors la clé depuis la console Hostinger
          # (`cat /etc/ssh/ssh_host_ed25519_key.pub`), jamais depuis ssh-keyscan
          # seul, qui croit ce que le réseau lui répond.
          # HostKeyAlias : la ligne ne dépend pas de l'adresse IP, qui reste un secret.
          echo 'citatio-vps ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILgozgycZDFXg9N4uu8YQT1v+7eTJsGhFMX1HK9ehB3L' > ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=30
                    -o StrictHostKeyChecking=yes -o HostKeyAlias=citatio-vps)

          # Synchronise la conf d'infra vers le VPS AVANT de (re)démarrer la stack.
          # Sans ça, modifier docker-compose.yml / Caddyfile / init.sql dans le repo
          # n'a AUCUN effet sur le VPS (le déploiement ne faisait que tirer les images).
          scp "${ssh_opts[@]}" docker-compose.yml Caddyfile deploy.sh "$VPS:/opt/citatio/"
          scp "${ssh_opts[@]}" backend/docker/postgres/init.sql "$VPS:/opt/citatio/backend/docker/postgres/"

          # docker-compose.yml lit ces variables via ${VAR:-défaut} : sans ce
          # fichier, les valeurs par défaut s'appliquent, u1 démarre sans
          # identifiants SMTP et chaque demande de contact finit en base avec
          # le statut FAILED. Le .env n'est jamais versionné, il est réécrit à
          # chaque déploiement depuis les secrets GitHub.
          #
          # Écrit avec `printf` et envoyé sur l'entrée standard de ssh : les
          # valeurs ne touchent ni le disque du runner, ni une ligne de commande,
          # et ne sont jamais réinterprétées par un shell. Réserve connue :
          # docker compose lit ce fichier ensuite, un mot de passe contenant $
          # y serait pris pour une interpolation. Si le compte d'envoi en a un,
          # le doubler ($$) au moment de créer le secret.
          #
          # umask avant l'écriture : le fichier naît en 600. Écriture dans un
          # fichier temporaire puis `mv` : une coupure réseau en cours de copie
          # ne laisse pas un .env tronqué.
          {
            printf 'MAIL_HOST=%s\n'      "$MAIL_HOST"
            printf 'MAIL_PORT=%s\n'      "$MAIL_PORT"
            printf 'MAIL_SSL=%s\n'       "$MAIL_SSL"
            printf 'MAIL_USERNAME=%s\n'  "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%s\n'  "$MAIL_PASSWORD"
            printf 'MAIL_FROM=%s\n'      "$MAIL_FROM"
            printf 'MAIL_FROM_NAME=%s\n' "$MAIL_FROM_NAME"
            printf 'MAIL_TO=%s\n'        "$MAIL_TO"
          } | ssh "${ssh_opts[@]}" "$VPS" \
                'umask 077 && cat > /opt/citatio/.env.tmp && mv /opt/citatio/.env.tmp /opt/citatio/.env'

          # Le PAT GHCR arrive sur l'entrée standard de deploy.sh, qui le passe
          # à `docker login --password-stdin`.
          printf '%s' "$GHCR_PAT" | ssh "${ssh_opts[@]}" "$VPS" 'bash /opt/citatio/deploy.sh'

      # Vérifie ce que voit réellement un visiteur. Sans ce contrôle, la gateway a
      # tourné douze jours sur un ancien Caddyfile avec un pipeline au vert
      # (audit INF-01). Mêmes points que la vérification d'infrastructure du CLAUDE.md §2.3.
      - name: Verify production
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$1"; }
          check() {
            got=$(code "$1")
            if [ "$got" != "$2" ]; then echo "ECHEC $1 : attendu $2, obtenu $got"; exit 1; fi
            echo "ok $1 -> $got"
          }

          # u1 est recréé à chaque déploiement (nouvelle image) et met jusqu'à
          # 40 s à démarrer : on attend qu'il réponde avant de conclure. 405 en
          # GET, puisque la route n'accepte que POST.
          for _ in $(seq 1 30); do
            [ "$(code https://citatio-geo.com/api/u1/contact-requests)" = 405 ] && break
            sleep 5
          done

          check https://citatio-geo.com/ 200
          check https://citatio-geo.com/faq 200
          check https://www.citatio-geo.com/faq 301
          check https://citatio-geo.com/page-inexistante 404
          check https://citatio-geo.com/api/u1/ping-u2 404
          check https://citatio-geo.com/api/u2/ping-u1 404
          check https://citatio-geo.com/api/u1/contact-requests 405
          curl -sI --max-time 15 https://citatio-geo.com/ | grep -qi '^strict-transport-security:' \
            || { echo "ECHEC : en-tete HSTS absent"; exit 1; }

  # ─────────────────────────────────────────────
  # Job 6 : Nettoyage des images GHCR (develop only)
  # Chaque déploiement publie une nouvelle version de chaque image, et
  # l'ancienne perd son tag `latest` sans être supprimée : le stockage
  # GitHub Packages grossissait à chaque push. On garde les 3 versions les
  # plus récentes : l'image en production et les 2 précédentes, qui restent
  # récupérables par digest pour revenir en arrière.
  # Placé après `deploy`, et seulement s'il réussit : aucune version n'est
  # supprimée tant que la nouvelle n'est pas en ligne.
  # ─────────────────────────────────────────────
  cleanup-images:
    name: Clean up old GHCR images
    needs: deploy
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      # Un paquet en échec ne doit pas empêcher le nettoyage des deux autres.
      fail-fast: false
      matrix:
        image: [ frontend, u1-communication, u2-blog ]

    steps:
      - name: Keep the 3 most recent versions of ${{ matrix.image }}
        uses: actions/delete-package-versions@v5
        with:
          # Nom du paquet GHCR : le chemin après le propriétaire, comme dans
          # docker-compose.yml (ghcr.io/mariusdev80/citatio/<image>).
          package-name: citatio/${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 3
