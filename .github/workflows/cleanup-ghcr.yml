name: Clean up GHCR images

# Nettoyage quotidien des images publiées sur GitHub Packages.
#
# Chaque build publie une version de chaque image, PR comprises : sans ménage,
# le stockage grossit sans fin. On garde les 20 versions les plus récentes, plus
# celle taguée `prod` quel que soit son âge : c'est l'image en production, elle
# doit rester téléchargeable pour un redémarrage ou une reprise du VPS.
#
# Workflow à part, une fois par jour, et non plus à la fin de chaque déploiement :
# le 21 septembre 2026, un build a échoué sur `ERROR: unknown blob` en publiant
# u2-blog pendant qu'un nettoyage tournait. L'explication la plus probable est une
# course entre la suppression de versions et un build concurrent qui réutilisait
# des couches partagées. Elle n'est pas prouvée, mais un ménage nocturne suffit
# largement au besoin et retire l'occasion.
#
# Script plutôt que actions/delete-package-versions : pour une image, son filtre
# `ignore-versions` porte sur le digest et non sur les tags, il ne sait donc pas
# épargner `prod`.
on:
  schedule:
    # 3 h 30 UTC, loin des heures ouvrées : aucun déploiement en cours.
    - cron: '30 3 * * *'
  # Pour le lancer à la main, par exemple après une série de PR.
  workflow_dispatch:

permissions: {}

jobs:
  cleanup-images:
    name: Clean up old GHCR images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      KEEP: 20
    steps:
      - name: Keep the 20 most recent versions, and the production one
        run: |
          set -euo pipefail
          for image in frontend u1-communication u2-blog; do
            # Nom du paquet GHCR : le chemin après le propriétaire, comme dans
            # docker-compose.yml (ghcr.io/mariusdev80/citatio/<image>), encodé.
            pkg="citatio%2F$image"
            # `latest` est aussi épargné : c'est l'image que la production a
            # utilisée jusqu'au passage aux tags par commit.
            gh api --paginate "/users/$OWNER/packages/container/$pkg/versions" \
                --jq '.[] | {id, created_at, tags: .metadata.container.tags}' \
              | jq -s --argjson keep "$KEEP" '
                  sort_by(.created_at) | reverse | .[$keep:][]
                  | select((.tags | index("prod")) == null and (.tags | index("latest")) == null)
                  | .id' \
              | while read -r id; do
                  gh api -X DELETE "/users/$OWNER/packages/container/$pkg/versions/$id"
                  echo "supprimé : $image, version $id"
                done
          done
