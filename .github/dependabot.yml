version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      angular: { patterns: ["@angular/*", "@angular-devkit/*"] }
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/frontend", "/backend/u1-communication", "/backend/u2-blog"]
    target-branch: develop
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
