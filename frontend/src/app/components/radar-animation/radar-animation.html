<div class="absolute inset-0 z-0 opacity-100 dark:opacity-40 transition-opacity">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[140%] max-w-[1200px] z-10 opacity-80 dark:opacity-100">
  <svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto animate-slow-spin">
    <circle cx="400" cy="400" r="140" [attr.stroke]="theme.isDark() ? '#60a5fa' : '#3b82f6'" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="2 12" />
    <circle cx="400" cy="400" r="220" [attr.stroke]="theme.isDark() ? '#818cf8' : '#6366f1'" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 20" />
    <circle cx="400" cy="400" r="300" stroke-opacity="0.1" stroke-width="0.8" stroke-dasharray="1 30" [attr.stroke]="theme.isDark() ? '#60a5fa' : '#3b82f6'" />

    <circle r="5.5" [attr.fill]="theme.isDark() ? '#60a5fa' : '#3b82f6'" class="blur-[1px]">
      <animateMotion dur="14s" repeatCount="indefinite" path="M 400, 260 a 140,140 0 1,0 1,0 Z" />
    </circle>
    <circle r="4.5" [attr.fill]="theme.isDark() ? '#818cf8' : '#6366f1'" opacity="0.9">
      <animateMotion dur="24s" repeatCount="indefinite" path="M 400, 180 a 220,220 0 1,1 1,0 Z" />
    </circle>
    <circle r="4" fill="#2563eb" opacity="0.7">
      <animateMotion dur="19s" begin="-3s" repeatCount="indefinite" path="M 400, 180 a 220,220 0 1,0 1,0 Z" />
    </circle>
    <circle r="5" fill="#818cf8" opacity="0.5">
      <animateMotion dur="40s" repeatCount="indefinite" path="M 400, 100 a 300,300 0 1,1 1,0 Z" />
    </circle>
    <circle r="3" fill="#3b82f6" opacity="0.4">
      <animateMotion dur="50s" begin="-8s" repeatCount="indefinite" path="M 400, 20 a 380,380 0 1,0 1,0 Z" />
    </circle>
  </svg>
</div>

<div class="absolute bottom-0 left-0 w-full h-[300px] z-20">
  <div class="absolute inset-0 bg-gradient-to-t from-[#fafafa] via-[#fafafa]/80 to-transparent transition-opacity duration-500 opacity-100 dark:opacity-0"></div>
  <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent transition-opacity duration-500 opacity-0 dark:opacity-100"></div>
</div>
