<nav
  class="ct-masthead"
  [class.ct-masthead--scrolled]="isScrolled()"
  aria-label="Navigation principale">
  <div class="ct-section flex items-center justify-between gap-6">

    <a routerLink="/" class="ct-focus-ring ct-wordmark shrink-0" aria-label="Citatio, accueil">
      Citatio
    </a>

    <!-- Desktop -->
    <div class="hidden items-center gap-8 md:flex">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="ct-navlink--active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="ct-navlink">
          {{ item.label }}
        </a>
      }

      <button
        type="button"
        (click)="theme.toggle()"
        class="ct-focus-ring rounded-sm p-2 text-ink-soft transition-colors hover:text-ink"
        [attr.aria-label]="theme.isDark() ? 'Passer au thème clair' : 'Passer au thème sombre'">
        <i class="pi" [class.pi-sun]="theme.isDark()" [class.pi-moon]="!theme.isDark()" aria-hidden="true"></i>
      </button>

      <a routerLink="/contact" class="ct-btn">Parlons de votre projet</a>
    </div>

    <!-- Mobile -->
    <div class="flex items-center gap-1 md:hidden">
      <button
        type="button"
        (click)="theme.toggle()"
        class="ct-focus-ring rounded-sm p-2 text-ink-soft"
        [attr.aria-label]="theme.isDark() ? 'Passer au thème clair' : 'Passer au thème sombre'">
        <i class="pi" [class.pi-sun]="theme.isDark()" [class.pi-moon]="!theme.isDark()" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="navbar-menu"
        [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
        class="ct-focus-ring rounded-sm p-2 text-ink">
        <i class="pi" [class.pi-times]="menuOpen()" [class.pi-bars]="!menuOpen()" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div id="navbar-menu" class="mt-3 border-t border-rule bg-paper md:hidden">
      <div class="ct-section flex flex-col py-2">
        @for (item of navItems(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="ct-navlink--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="ct-navlink border-b border-rule py-4">
            {{ item.label }}
          </a>
        }
        <a routerLink="/contact" class="ct-btn mt-5 mb-4">Parlons de votre projet</a>
      </div>
    </div>
  }
</nav>
