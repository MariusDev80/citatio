<nav
  class="ct-navbar"
  [class.ct-navbar--scrolled]="isScrolled()"
  role="navigation"
  aria-label="Navigation principale">
  <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2 group" aria-label="Accueil Citatio">
      <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200 dark:shadow-blue-900/20 group-hover:scale-110 transition-transform">
        <i class="pi pi-search text-lg"></i>
      </div>
      <span class="text-2xl font-black tracking-tighter text-slate-800 dark:text-white uppercase">CITATIO</span>
    </a>

    <!-- Desktop links -->
    <div class="hidden md:flex items-center gap-6">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="!text-blue-600 dark:!text-blue-400"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
          {{ item.label }}
        </a>
      }

      <!-- Dark mode toggle -->
      <button
        (click)="theme.toggle()"
        class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all"
        [attr.aria-label]="theme.isDark() ? 'Passer au mode clair' : 'Passer au mode sombre'">
        <i [class]="theme.isDark() ? 'pi pi-sun' : 'pi pi-moon'"></i>
      </button>

      <a routerLink="/contact" class="bg-slate-900 dark:bg-blue-600 text-white px-6 py-2.5 rounded-full text-sm font-bold hover:bg-blue-600 dark:hover:bg-blue-500 transition-all shadow-md active:scale-95">
        Contact
      </a>
    </div>

    <!-- Mobile controls -->
    <div class="md:hidden flex items-center gap-4">
      <button
        (click)="theme.toggle()"
        class="p-2 text-slate-600 dark:text-slate-300"
        [attr.aria-label]="theme.isDark() ? 'Passer au mode clair' : 'Passer au mode sombre'">
        <i [class]="theme.isDark() ? 'pi pi-sun' : 'pi pi-moon'"></i>
      </button>
      <button
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="navbar-menu"
        aria-label="Ouvrir le menu de navigation"
        class="p-2 text-slate-800 dark:text-white">
        <i [class]="menuOpen() ? 'pi pi-times text-xl' : 'pi pi-bars text-xl'"></i>
      </button>
    </div>
  </div>

  <!-- Mobile dropdown -->
  @if (menuOpen()) {
    <div
      id="navbar-menu"
      class="md:hidden bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 shadow-lg">
      <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col gap-1">
        @for (item of navItems(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="!text-blue-600 dark:!text-blue-400 !bg-blue-50 dark:!bg-blue-900/20"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="text-base font-semibold text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 py-3 px-4 rounded-xl transition-colors">
            {{ item.label }}
          </a>
        }
        <a routerLink="/contact" class="mt-2 text-center bg-slate-900 dark:bg-blue-600 text-white py-3 px-4 rounded-xl font-bold hover:bg-blue-600 dark:hover:bg-blue-500 transition-all">
          Contact
        </a>
      </div>
    </div>
  }
</nav>
