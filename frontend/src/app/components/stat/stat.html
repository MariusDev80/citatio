<div class="flex flex-col items-center text-center gap-3 px-4">
  <span class="ct-stat-icon" aria-hidden="true">
    <i [class]="stat().icon"></i>
  </span>

  @if (isNumeric()) {
    <span class="ct-stat-figure" aria-hidden="true">{{ displayValue() }}</span>
  }

  <span class="text-sm font-semibold ct-text-secondary leading-snug">{{ stat().label }}</span>
</div>
