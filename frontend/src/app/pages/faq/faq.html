<div class="pt-32 pb-16 max-w-3xl mx-auto px-6">
  <h1 class="ct-page-title mb-12">Questions Fréquemment Posées</h1>

  <p-accordion [multiple]="true" [value]="['0']">
    @for (item of faqItems(); track item.question; let i = $index) {
      <p-accordion-panel [value]="i.toString()">
        <p-accordion-header>{{ item.question }}</p-accordion-header>
        <p-accordion-content>
          <p class="ct-text-body py-2">{{ item.answer }}</p>
        </p-accordion-content>
      </p-accordion-panel>
    }
  </p-accordion>
</div>
