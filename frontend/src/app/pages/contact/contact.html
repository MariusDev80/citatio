<div class="contact-container">
  <h1>Nous contacter</h1>

  <div class="contact-grid">
    <p-card class="contact-info">
      <h3>Coordonnées</h3>
      <div class="info-item">
        <i class="pi pi-envelope centered"></i>
        <p>Email : <a href="mailto:contact@citatio-geo.com">contact&#64;citatio-geo.com</a></p>
      </div>
      <div class="info-item">
        <i class="pi pi-phone"></i>
        <p>Tél : <a href="tel:+33767478372">+33 7 67 47 83 72</a></p>
      </div>
      <div class="info-item">
        <i class="pi pi-map-marker"></i>
        <p>1 rue de l'Aven, 44240 La Chapelle-sur-Erdre</p>
      </div>
    </p-card>

    <p-card class="contact-form-card">
      <h3>Formulaire de Contact</h3>

      @if (submitSuccess()) {
        <div class="success-msg">
          <i class="pi pi-check-circle"></i> Votre message a été envoyé avec succès !
        </div>
      }

      <form [formGroup]="contactForm" (ngSubmit)="submitForm()">
        <div class="field">
          <label for="name">Nom</label>
          <input pInputText id="name" formControlName="name" placeholder="Votre nom" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input pInputText id="email" type="email" formControlName="email" placeholder="Votre email" />
        </div>

        <div class="field">
          <label for="subject">Sujet</label>
          <input pInputText id="subject" formControlName="subject" placeholder="Sujet" />
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea pTextarea id="message" formControlName="message" rows="5" placeholder="Votre message"></textarea>
        </div>

        <p-button
          type="submit"
          label="Envoyer"
          icon="pi pi-send"
          [disabled]="contactForm.invalid && submitted()" />
      </form>
    </p-card>
  </div>
</div>
