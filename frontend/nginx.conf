server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Angular pre-rend chaque route dans son propre dossier (/ce-site/index.html).
    # On sert ce fichier DIRECTEMENT plutot que de laisser nginx resoudre le
    # dossier : `try_files $uri/` provoquait un 301 de /ce-site vers /ce-site/,
    # en contradiction avec les balises <link rel="canonical"> du site, qui
    # declarent l'URL sans slash final. Le dernier segment garde le repli SPA
    # pour la 404, rendue cote client.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Une URL inconnue doit repondre 404, pas 200 : servir la page d'accueil
    # avec un code 200 est un « soft 404 », que Google signale et desindexe mal.
    # `error_page` renvoie le corps du SPA, Angular affiche alors sa page
    # « Cette page n'existe pas », mais avec le bon statut HTTP.
    error_page 404 /index.html;

    # Filet de securite : nginx est derriere Caddy, qui termine le TLS et
    # proxifie en clair. Une redirection absolue serait donc forgee en http://
    # et couterait un aller-retour supplementaire en clair. En relatif, le
    # navigateur conserve le schema et l'hote d'origine.
    absolute_redirect off;

    # Le routage /api/* est assure par la gateway Caddy (vers u1-communication /
    # u2-blog) en amont : le frontend ne sert que les fichiers statiques du SPA.
}
