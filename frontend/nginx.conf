server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le routage /api/* est assuré par la gateway Caddy (vers u1-communication /
    # u2-blog) en amont : le frontend ne sert que les fichiers statiques du SPA.
}