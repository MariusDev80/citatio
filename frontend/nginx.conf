server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Anciennes URL anglaises, renommees en francais. Google a deja crawle
    # /about et /services : sans ces 301, le peu d'anteriorite acquis serait
    # perdu et les deux URL repondraient 404. A conserver indefiniment, une
    # redirection permanente ne coute rien.
    location = /about    { return 301 /qui-sommes-nous; }
    location = /services { return 301 /offres-et-tarifs; }

    # Les assets Angular portent un hash de contenu dans leur nom
    # (main-XXXX.js) : leur URL change des que leur contenu change, donc on peut
    # les mettre en cache un an sans risque de servir une version perimee.
    # Sans ce bloc, nginx n'envoyait aucun Cache-Control et le navigateur
    # revalidait tout a chaque visite, polices comprises (29 Ko a lui seul).
    location ~* \.(?:js|css|woff2|woff|ttf|otf|png|jpe?g|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Le HTML, lui, ne doit jamais etre fige : c'est le point d'entree qui
    # reference les assets haches. On le laisse revalider a chaque fois.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers de reference pour les moteurs : ils changent rarement mais doivent
    # pouvoir etre recrawles rapidement apres une mise a jour.
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Angular pre-rend chaque route dans son propre dossier (/ce-site/index.html).
    # On sert ce fichier DIRECTEMENT plutot que de laisser nginx resoudre le
    # dossier : `try_files $uri/` provoquait un 301 de /ce-site vers /ce-site/,
    # en contradiction avec les balises <link rel="canonical"> du site, qui
    # declarent l'URL sans slash final. Le dernier segment garde le repli SPA
    # pour la 404, rendue cote client.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Une URL inconnue doit repondre 404, pas 200 : servir la page d'accueil
    # avec un code 200 est un « soft 404 », que Google signale et desindexe mal.
    # `error_page` renvoie le corps du SPA, Angular affiche alors sa page
    # « Cette page n'existe pas », mais avec le bon statut HTTP.
    error_page 404 /index.html;

    # Filet de securite : nginx est derriere Caddy, qui termine le TLS et
    # proxifie en clair. Une redirection absolue serait donc forgee en http://
    # et couterait un aller-retour supplementaire en clair. En relatif, le
    # navigateur conserve le schema et l'hote d'origine.
    absolute_redirect off;

    # Le routage /api/* est assure par la gateway Caddy (vers u1-communication /
    # u2-blog) en amont : le frontend ne sert que les fichiers statiques du SPA.
}
