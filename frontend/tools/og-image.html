<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Instrument Serif'; src: url('../public/fonts/instrument-serif-400.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Geist'; src: url('../public/fonts/geist-var.woff2') format('woff2'); font-weight: 400 600; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #f9f8f5; color: #12131a;
         font-family: 'Geist', sans-serif; display: flex; flex-direction: column;
         justify-content: space-between; padding: 72px 80px; }
  .eyebrow { font-size: 20px; font-weight: 500; text-transform: uppercase;
             letter-spacing: 0.18em; color: #63656f; }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 96px;
       line-height: 1.0; letter-spacing: -0.02em; max-width: 15ch; }
  .rule { height: 1px; background: rgba(18,19,26,0.28); margin: 40px 0 32px; }
  footer { display: flex; justify-content: space-between; align-items: baseline; }
  .wordmark { font-family: 'Instrument Serif', serif; font-size: 40px; }
  .meta { font-size: 22px; color: #4a4c57; }
  .accent { color: #26359c; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">Agence web · Loire-Atlantique</p>
    <div class="rule"></div>
    <h1>Des sites vitrines faits à la main, près de Nantes.</h1>
  </div>
  <footer>
    <span class="wordmark">Citatio</span>
    <span class="meta">Conception · Développement · <span class="accent">Hébergement</span></span>
  </footer>
</body>
</html>
