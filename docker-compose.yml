services:
  database:
    image: postgres:15-alpine
    container_name: citatio-db
    restart: always
    environment:
      POSTGRES_DB: citatio_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./data/db:/var/lib/postgresql/data
      # Cree citatio_u1_db et citatio_u2_db au premier init (volume vide uniquement).
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Les microservices attendent que la base soit reellement prete (evite les
    # "Connection refused" au demarrage pendant l'init de Postgres).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d citatio_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Microservice u1-communication (email / contact / comms), port 8081 ──
  u1-communication:
    image: ghcr.io/mariusdev80/citatio/u1-communication:latest
    build:
      context: ./backend
      dockerfile: u1-communication/Dockerfile
    container_name: citatio-u1
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_NAME: citatio_u1_db
      DB_USER: user
      DB_PASSWORD: password
      U2_BASE_URL: http://u2-blog:8082
    # 'expose' uniquement : joignable par Caddy et par u2 via le reseau Docker
    # interne, jamais directement depuis Internet. (Debug local : compose override.)
    expose:
      - "8081"
    # Sante propre au service : Docker connait l'etat de u1 independamment de u2.
    # Sonde de LIVENESS et non /api/u1/health : cette derniere repond UP tant que
    # le serveur web repond, base coupee comprise. La liveness ignore elle aussi la
    # base, deliberement (une base momentanement absente ne doit pas declencher une
    # boucle de redemarrage), la readiness est celle qui l'inclut.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  # ── Microservice u2-blog (articles), port 8082, appelle u1 en REST ──
  u2-blog:
    image: ghcr.io/mariusdev80/citatio/u2-blog:latest
    build:
      context: ./backend
      dockerfile: u2-blog/Dockerfile
    container_name: citatio-u2
    restart: always
    # AUCUNE dependance a u1-communication : les deux microservices demarrent et
    # vivent independamment. Une coupure de u1 ne doit ni empecher u2 de demarrer,
    # ni l'empecher de repondre (voir UpstreamClient : degradation gracieuse).
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_NAME: citatio_u2_db
      DB_USER: user
      DB_PASSWORD: password
      U1_BASE_URL: http://u1-communication:8081
    # 'expose' uniquement : joignable par Caddy via le reseau Docker interne,
    # jamais directement depuis Internet.
    expose:
      - "8082"
    # Sante propre au service : Docker connait l'etat de u2 independamment de u1.
    # Sonde de LIVENESS et non /api/u2/health : cette derniere repond UP tant que
    # le serveur web repond, base coupee comprise. La liveness ignore elle aussi la
    # base, deliberement (une base momentanement absente ne doit pas declencher une
    # boucle de redemarrage), la readiness est celle qui l'inclut.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  frontend:
    image: ghcr.io/mariusdev80/citatio/frontend:latest
    build:
      context: ./frontend
    container_name: citatio-front
    expose:
      - "80"

  gateway:
    image: caddy:2.11.4-alpine
    container_name: citatio-gateway
    restart: always
    ports:
      - "80:80"     # HTTP (pour redirection automatique)
      - "443:443"   # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    depends_on:
      - frontend
      - u1-communication
      - u2-blog
