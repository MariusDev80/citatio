services:
  database_u1:
    image: postgres:15-alpine
    container_name: citatio-db-u1
    restart: always
    environment:
      POSTGRES_DB: citatio_u1_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./data/db_u1:/var/lib/postgresql/data

  database_u2:
    image: postgres:15-alpine
    container_name: citatio-db-u2
    restart: always
    environment:
      POSTGRES_DB: citatio_u2_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./data/db_u2:/var/lib/postgresql/data

  u1-communication:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: u1-communication
    container_name: citatio-u1-communication
    depends_on:
      - database_u1
    environment:
      DB_HOST: database_u1
      DB_NAME: citatio_u1_db
      DB_USER: user
      DB_PASSWORD: password
    expose:
      - "8080"

  u2-blog:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: u2-blog
    container_name: citatio-u2-blog
    depends_on:
      - database_u2
    environment:
      DB_HOST: database_u2
      DB_NAME: citatio_u2_db
      DB_USER: user
      DB_PASSWORD: password
    expose:
      - "8080"

  frontend:
    image: ghcr.io/mariusdev80/citatio/frontend:latest
    container_name: citatio-front
    expose:
      - "80"

  gateway:
    image: caddy:latest
    container_name: citatio-gateway
    restart: always
    ports:
      - "80:80"     # HTTP (pour redirection automatique)
      - "443:443"   # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    depends_on:
      - frontend
      - u1-communication
      - u2-blog