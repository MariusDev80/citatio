# Rotation des logs Docker, commune a tous les services. Le pilote json-file ne
# limite rien par defaut : les journaux grossissaient sans fin sur le disque du
# VPS, celui-la meme qui porte la base (audit INF-04). 3 fichiers de 10 Mo, soit
# 30 Mo au plus par conteneur : de quoi remonter plusieurs jours en arriere.
# Declare ici plutot que dans /etc/docker/daemon.json : versionne, et deploye
# avec le reste de la configuration.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Ce fichier decrit la production. L'environnement dev le reprend tel quel et ne
# change que ce qui doit l'etre (noms, base jetable, gateway sans port) dans
# docker-compose.dev.yml : un deploiement qui passe en dev a donc eprouve la
# meme definition que celle de la production.
#
# IMAGE_TAG : SHA du commit dont les images ont ete construites, ecrit dans le
# .env par le deploiement. Chaque image est ainsi tracable jusqu'a son commit,
# et revenir en arriere revient a redeployer un SHA precedent (audit CI-01).
# `latest` ne sert plus qu'au build local (`docker compose up --build`).

# Nom de projet fixe plutot que celui du dossier : deploy.sh cree le reseau
# citatio-edge avec l'etiquette de ce projet, qui doit donc etre connue d'avance.
name: citatio

services:
  database:
    image: postgres:15-alpine
    container_name: citatio-db
    restart: always
    logging: *logging
    environment:
      POSTGRES_DB: citatio_db
      # Superutilisateur : administration seulement, aucun service ne s'en sert.
      # Mots de passe : .env ecrit par le deploiement depuis les secrets GitHub
      # (le job echoue s'ils manquent). Les defauts ':-' ne servent qu'au
      # developpement local, sur une base qui n'est publiee sur aucun port.
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      # Lus par init-databases.sh pour creer u1_app et u2_app.
      U1_DB_PASSWORD: ${U1_DB_PASSWORD:-u1_dev_password}
      U2_DB_PASSWORD: ${U2_DB_PASSWORD:-u2_dev_password}
    volumes:
      - ./data/db:/var/lib/postgresql/data
      # Cree les bases et les roles de u1 et u2 au premier init (volume vide
      # uniquement). Changer un mot de passe ensuite ne passe plus par ici :
      # ALTER ROLE a la main, ou volume vide si les donnees sont jetables.
      - ./backend/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    # Les microservices attendent que la base soit reellement prete (evite les
    # "Connection refused" au demarrage pendant l'init de Postgres).
    # -h 127.0.0.1 : pendant l'init, l'image lance un serveur temporaire qui
    # n'ecoute que sur le socket Unix. Sans -h, la sonde le declarait sain avant
    # que les roles existent, et u1 demarrait sur un echec d'authentification.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d citatio_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Microservice u1-communication (email / contact / comms), port 8081 ──
  u1-communication:
    image: ghcr.io/mariusdev80/citatio/u1-communication:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: u1-communication/Dockerfile
    container_name: citatio-u1
    restart: always
    logging: *logging
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_NAME: citatio_u1_db
      # Role limite a citatio_u1_db (init-databases.sh), jamais le superutilisateur.
      DB_USER: u1_app
      DB_PASSWORD: ${U1_DB_PASSWORD:-u1_dev_password}
      U2_BASE_URL: http://u2-blog:8082
      # ── Envoi des emails du formulaire de contact ──
      # Rien n'est code en dur cote application : hote, port, identifiants et
      # adresses arrivent tous par variable. Les valeurs sensibles viennent de
      # l'environnement du VPS (fichier .env a cote de docker-compose.yml,
      # alimente par les secrets GitHub Actions), jamais du depot.
      # Les defauts ':-' ne sont la que pour un demarrage local sans .env ;
      # sans MAIL_USERNAME ni MAIL_PASSWORD, l'authentification SMTP echoue et
      # la demande est enregistree en base avec le statut FAILED, ce qui est le
      # comportement voulu : on perd le mail, jamais le lead.
      MAIL_HOST: ${MAIL_HOST:-smtp.hostinger.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SSL: ${MAIL_SSL:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-client-request@citatio-geo.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Formulaire Citatio}
      MAIL_TO: ${MAIL_TO:-contact@citatio-geo.com}
    # 'expose' uniquement : joignable par Caddy et par u2 via le reseau Docker
    # interne, jamais directement depuis Internet. (Debug local : compose override.)
    expose:
      - "8081"
    # Sante propre au service : Docker connait l'etat de u1 independamment de u2.
    # Sonde de LIVENESS et non /api/u1/health : cette derniere repond UP tant que
    # le serveur web repond, base coupee comprise. La liveness ignore elle aussi la
    # base, deliberement (une base momentanement absente ne doit pas declencher une
    # boucle de redemarrage), la readiness est celle qui l'inclut.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  # ── Microservice u2-blog (articles), port 8082, appelle u1 en REST ──
  u2-blog:
    image: ghcr.io/mariusdev80/citatio/u2-blog:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: u2-blog/Dockerfile
    container_name: citatio-u2
    restart: always
    logging: *logging
    # AUCUNE dependance a u1-communication : les deux microservices demarrent et
    # vivent independamment. Une coupure de u1 ne doit ni empecher u2 de demarrer,
    # ni l'empecher de repondre (voir UpstreamClient : degradation gracieuse).
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_NAME: citatio_u2_db
      # Role limite a citatio_u2_db (init-databases.sh), jamais le superutilisateur.
      DB_USER: u2_app
      DB_PASSWORD: ${U2_DB_PASSWORD:-u2_dev_password}
      U1_BASE_URL: http://u1-communication:8081
    # 'expose' uniquement : joignable par Caddy via le reseau Docker interne,
    # jamais directement depuis Internet.
    expose:
      - "8082"
    # Sante propre au service : Docker connait l'etat de u2 independamment de u1.
    # Sonde de LIVENESS et non /api/u2/health : cette derniere repond UP tant que
    # le serveur web repond, base coupee comprise. La liveness ignore elle aussi la
    # base, deliberement (une base momentanement absente ne doit pas declencher une
    # boucle de redemarrage), la readiness est celle qui l'inclut.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  frontend:
    image: ghcr.io/mariusdev80/citatio/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    container_name: citatio-front
    # Seul service qui n'avait aucune politique de redemarrage : apres un reboot
    # du VPS, Caddy revenait mais pas nginx, et tout le site repondait 502
    # (audit INF-02). unless-stopped plutot que always : un conteneur arrete a la
    # main pour une intervention ne revient pas tout seul au redemarrage du demon.
    restart: unless-stopped
    logging: *logging
    expose:
      - "80"

  gateway:
    image: caddy:2.11.4-alpine
    container_name: citatio-gateway
    restart: always
    logging: *logging
    ports:
      - "80:80"     # HTTP (pour redirection automatique)
      - "443:443"   # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Regles communes a la production et a la dev, importees par le Caddyfile.
      - ./caddy/routes.caddy:/etc/caddy/routes.caddy:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    # DEV_AUTH_HASH, hash de l'authentification de dev.citatio-geo.com, ecrit par
    # le deploiement de production. Fichier a part plutot que le .env : il est lu
    # tel quel (valeur entre apostrophes), alors qu'un hash bcrypt plein de $
    # serait interpole par Compose. Facultatif : sans lui, en local, le Caddyfile
    # retombe sur un hash qui n'ouvre rien.
    env_file:
      - path: .env.gateway
        required: false
    networks:
      - default
      # Seul lien entre la production et la dev : la gateway de production y
      # rejoint la gateway dev, et aucun autre conteneur.
      - edge
    depends_on:
      - frontend
      - u1-communication
      - u2-blog

networks:
  # Nom fixe, pour que le projet dev le retrouve. Cree par la production ; le
  # deploiement le cree aussi s'il manque, si bien que l'ordre des premiers
  # deploiements n'importe pas.
  edge:
    name: citatio-edge
